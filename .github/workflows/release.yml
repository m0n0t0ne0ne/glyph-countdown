# Publishes a release automatically. Every push to main is checked: if versionName in
# app/AndroidManifest.xml has no release yet, the app is built from that commit, signed with
# the key held in repository secrets, and published as release v<versionName> (the tag is
# created by the release). So releasing is just: bump the version, add release notes, push main.
# Pushing a v* tag by hand still works, as does "Run workflow" on the Actions tab.
#
# Repository secrets (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64  the release keystore (.jks), base64-encoded
#   KEYSTORE_PASS    its password (keystore and key share one password; key alias "glyph")
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history, to check the commit is on main

      - name: Decide whether this commit needs a release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(grep -o 'android:versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)
          echo "version=$app" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit is not on main; only commits on main are released"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $app in app/AndroidManifest.xml"; exit 1
          fi
          if gh release view "v$app" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$app is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$app has no release yet; releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # to create the release and its tag
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download pinned build tools
        run: ./setup-deps.sh

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is not set"; exit 1; fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and sign
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "KEYSTORE_PASS secret is not set"; exit 1; fi
          REQUIRE_KEYSTORE=1 KEYSTORE="$RUNNER_TEMP/release.jks" ./build.sh

      - name: Remove the signing key
        if: always()   # even if the build failed
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare the release
        run: |
          apk="GlyphCountdown-$VERSION.apk"
          cp out/GlyphCountdown.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          cert=$(java -cp deps/tools/apksig com.android.apksigner.ApkSignerTool verify --print-certs "$apk" \
                 | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          notes="docs/release-notes/$TAG.md"
          { if [ -f "$notes" ]; then cat "$notes"; else echo "Glyph Countdown $VERSION"; fi
            echo
            echo "SHA-256 (APK): \`$sha\`"
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > release-notes.md
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Glyph Countdown $VERSION" --notes-file release-notes.md
