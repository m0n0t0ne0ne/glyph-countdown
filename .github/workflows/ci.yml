# Builds the app on every push and pull request, so a broken build is caught before release.
# Signs with a throwaway key made for this run only; the real key is never used here.
name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download pinned build tools
        run: ./setup-deps.sh

      - name: Build with a throwaway key
        run: |
          export KEYSTORE="$RUNNER_TEMP/throwaway.jks"
          export KEYSTORE_PASS="$(openssl rand -hex 24)"
          ./build.sh
